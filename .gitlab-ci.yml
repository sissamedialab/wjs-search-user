default:
  image: python:3.11
  tags:
    - inasset

variables:
  PACKAGE_NAME: 'wjs.user_search'

# Not running any tests (at the moment), because they require a
# working installation of Janeway, with this django app installed.
stages:
  - build
  - deploy

include:
  - project: 'wjs/wjs-profile-project'
    ref: wjs-production
    file: '.gitlab-ci-pkg-build-and-upload.yml'
  - project: 'wjs/wjs-profile-project'
    ref: wjs-production
    file: '.gitlab-ci-pkg-deploy.yml'




Upload package:
  only:
    - tags
  extends:
    - .upload-package


Deploy to pre-production:
  environment: pre-production
  extends:
    - .deploy
  # Deploying to pp means installing the last released (uploaded) package,
  # so the job only makes sense in tag pipelines, after "Upload package".
  needs:
    - Upload package
  rules:
    # Manual because we don't want to risk resetting some on-going translation:
    - if: $CI_COMMIT_TAG
      when: manual
  # Do not block the pipeline waiting for the manual job
  # (with `rules`, manual jobs default to allow_failure: false)
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    DEPLOY_CMD: "deploy-pp-search"


Deploy to production:
  extends:
    - .deploy
  # Deploying to prod means installing the last released (uploaded) package,
  # so the job only makes sense in tag pipelines, after "Upload package".
  needs:
    - Upload package
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  environment: production
  variables:
    SERVER_IP: "$PROD_SERVER_IP"
    SERVER_USER: "$PROD_SERVER_USER"
    DEPLOY_CMD: "deploy-prod-search"


Deploy to dev:
  extends:
    - .deploy
  environment: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # The dev instance only deploys wjs-develop, so the job exists
    # only in pipelines for that branch (no rule matches elsewhere).
    - if: $CI_COMMIT_REF_NAME == "wjs-develop"
      when: on_success
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    # The dev instance always deploys the wjs-develop branch (no ref accepted)
    DEPLOY_CMD: "deploy-dev-search"


# ======================
# Deploy to T1-T5
# ======================
.deploy-to-test-template:
  extends:
    - .deploy
  when: manual
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    TEST_INSTANCE: "t1"
    DEPLOY_CMD: "deploy-${TEST_INSTANCE}-search:${CI_COMMIT_SHA}"

Deploy to T1:
  environment: T1
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t1"

Deploy to T2:
  environment: T2
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t2"

Deploy to T3:
  environment: T3
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t3"

Deploy to T4:
  environment: T4
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t4"

Deploy to T5:
  environment: T5
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t5"
